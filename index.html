<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fullscreen</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: #000 url("https://raw.githubusercontent.com/aqtq/ULTIMATE_JTNK_BACKDOOR/refs/heads/main/4e48eea2-0588-475e-aa8d-cbc226c2a1a2.png") center / cover no-repeat;
  }
</style>
</head>
<body>
<script>
  const el = document.documentElement;

  function goFull() {
    const req = el.requestFullscreen || el.webkitRequestFullscreen;
    if (req) {
      try {
        const p = req.call(el);
        if (p && p.catch) p.catch(() => {});
      } catch (e) {}
    }
  }

  // 開いた瞬間に試す(多くのブラウザでは拒否されます)
  goFull();

  // 拒否された場合は、最初の操作で即フルスクリーン
  ['click', 'keydown', 'touchstart'].forEach(ev =>
    window.addEventListener(ev, goFull, { once: true })
  );
</script>
</body>
</html>
