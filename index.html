<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fullscreen</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: #000;
    cursor: none;
  }

  /* 背景画像(ちゃんと見える状態。点滅は明るさのフェードで表現) */
  #bg {
    position: fixed;
    inset: 0;
    background: #000 url("https://raw.githubusercontent.com/aqtq/ULTIMATE_JTNK_BACKDOOR/refs/heads/main/4e48eea2-0588-475e-aa8d-cbc226c2a1a2.png") center / cover no-repeat;
    animation: blink 0.8s ease-in-out infinite;
  }
  @keyframes blink {
    0%, 100% { filter: brightness(1)   saturate(1); }
    50%      { filter: brightness(.55) saturate(1.5); }
  }

  /* 虹色オーバーレイ(薄め・流れる) */
  #rainbow {
    position: fixed;
    inset: 0;
    background: linear-gradient(115deg,
      #ff0000, #ff9900, #ffee00, #33ff00, #00ffee, #0066ff, #cc00ff, #ff0000);
    background-size: 300% 300%;
    mix-blend-mode: soft-light;
    opacity: .5;
    animation: flow 6s linear infinite;
    pointer-events: none;
  }
  @keyframes flow {
    from { background-position: 0% 50%; }
    to   { background-position: 300% 50%; }
  }

  #vignette {
    position: fixed;
    inset: 0;
    background: radial-gradient(circle, transparent 60%, rgba(0,0,0,.55) 100%);
    pointer-events: none;
  }

  canvas { position: fixed; inset: 0; pointer-events: none; }
</style>
</head>
<body>
  <div id="bg"></div>
  <div id="rainbow"></div>
  <canvas id="fx"></canvas>
  <div id="vignette"></div>

<script>
  /* ===== 常にフルスクリーン ===== */
  const el = document.documentElement;

  function goFull() {
    if (document.fullscreenElement || document.webkitFullscreenElement) return;
    const req = el.requestFullscreen || el.webkitRequestFullscreen;
    if (req) {
      try {
        const p = req.call(el);
        if (p && p.catch) p.catch(() => {});
      } catch (e) {}
    }
  }

  goFull();
  ['pointerdown', 'click', 'keydown', 'touchstart'].forEach(ev =>
    window.addEventListener(ev, goFull)
  );
  document.addEventListener('fullscreenchange', () => {
    if (!document.fullscreenElement) setTimeout(goFull, 50);
  });

  /* ===== エフェクト(背景を隠さないよう毎フレーム透明にクリア) ===== */
  const cv = document.getElementById('fx');
  const ctx = cv.getContext('2d');
  let W, H;
  function resize() { W = cv.width = innerWidth; H = cv.height = innerHeight; }
  addEventListener('resize', resize);
  resize();

  const mouse = { x: 0, y: 0, moved: false };
  addEventListener('pointermove', e => {
    mouse.x = e.clientX; mouse.y = e.clientY; mouse.moved = true;
  });

  const particles = [];
  let hue = 0;

  function spawn(x, y, n, speed) {
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2;
      const s = Math.random() * speed;
      particles.push({
        x, y,
        vx: Math.cos(a) * s,
        vy: Math.sin(a) * s,
        life: 1,
        decay: .01 + Math.random() * .015,
        size: 2 + Math.random() * 4,
        hue: (hue + Math.random() * 60) % 360
      });
    }
  }
  addEventListener('pointerdown', e => spawn(e.clientX, e.clientY, 80, 7));

  let t = 0;
  function loop() {
    t += 0.02;
    hue = (hue + 2) % 360;

    ctx.clearRect(0, 0, W, H);
    ctx.globalCompositeOperation = 'lighter';

    if (Math.random() < .5) {
      spawn(Math.random() * W, H + 10, 1, 1);
      const p = particles[particles.length - 1];
      p.vx = (Math.random() - .5) * 1.2;
      p.vy = -2 - Math.random() * 3;
      p.size = 3 + Math.random() * 5;
    }
    if (mouse.moved) spawn(mouse.x, mouse.y, 3, 2);

    // 虹のリボン
    for (let k = 0; k < 3; k++) {
      ctx.beginPath();
      for (let x = 0; x <= W; x += 12) {
        const y = H / 2 + Math.sin(x * .005 + t * 2 + k) * (H * .22)
                 + Math.sin(x * .013 - t * 3) * 30;
        x === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
      }
      const c = (hue + k * 120) % 360;
      ctx.strokeStyle = `hsla(${c},100%,60%,.5)`;
      ctx.lineWidth = 4;
      ctx.shadowBlur = 20;
      ctx.shadowColor = `hsl(${c},100%,60%)`;
      ctx.stroke();
    }
    ctx.shadowBlur = 0;

    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.x += p.vx; p.y += p.vy; p.vy += 0.02;
      p.life -= p.decay;
      if (p.life <= 0) { particles.splice(i, 1); continue; }
      ctx.fillStyle = `hsla(${p.hue},100%,60%,${p.life})`;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2);
      ctx.fill();
    }
    requestAnimationFrame(loop);
  }
  loop();
</script>
</body>
</html>
